name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    name: test / build / drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # Clean install for each workspace. `npm ci` does not run build scripts,
      # so server/systemPrompt.js stays at its committed state for the drift
      # check below (it must verify committed state, not a regenerated file).
      - name: Clean install (root)
        run: npm ci

      - name: Clean install (server)
        working-directory: server
        run: npm ci

      - name: Clean install (client)
        working-directory: client
        run: npm ci

      # Drift gate: command surfaces + generated prompt must be in sync.
      # Runs on committed files, before any build step regenerates artifacts.
      - name: Drift check
        run: node scripts/check-drift.mjs

      - name: Full test suite
        run: npm test

      - name: Client build
        working-directory: client
        run: npm run build

      - name: Dependency audit (root)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (server)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (client)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
